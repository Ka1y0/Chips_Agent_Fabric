name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unit/integration, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Lint
        run: ruff check .

      - name: Run unit and integration suite
        run: |
          pytest \
            --ignore=tests/test_autonomous_host_subprocess.py \
            --ignore=tests/test_autonomous_subprocess_acceptance.py

      - name: Build distributions
        run: python -m build

  subprocess-acceptance:
    name: Acceptance / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: autonomous host
            test: tests/test_autonomous_host_subprocess.py
          - name: restart and multi-iteration
            test: tests/test_autonomous_subprocess_acceptance.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run isolated subprocess acceptance
        run: pytest "${{ matrix.test }}"
